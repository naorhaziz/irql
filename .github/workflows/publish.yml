name: Publish to crates.io

on:
  push:
    tags:
      - "v*.*.*"

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  publish:
    name: Publish to crates.io
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Verify tag version matches Cargo.toml
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF -replace 'refs/tags/v', ''
          $version = (Get-Content Cargo.toml | Select-String '^version = "(.+)"').Matches.Groups[1].Value
          if ($tag -ne $version) {
            Write-Error "Tag version ($tag) does not match Cargo.toml version ($version)"
            exit 1
          }
          Write-Output "Version check passed: $version"

      - name: Build all crates
        run: cargo build --all --verbose

      - name: Run tests
        run: cargo test --all --verbose

      - name: Publish irql_core
        working-directory: crates/irql_core
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_API_KEY }}
        run: cargo publish

      - name: Publish irql_macro
        working-directory: crates/irql_macro
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_API_KEY }}
        run: cargo publish

      - name: Publish irql
        working-directory: crates/irql
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_API_KEY }}
        run: cargo publish

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
