name: Publish

on:
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: publish
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  publish:
    name: Publish to crates.io
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@nightly

      - uses: Swatinem/rust-cache@v2

      - name: Verify tag matches Cargo.toml
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF -replace 'refs/tags/v', ''
          $cargoMeta = cargo metadata --format-version 1 --no-deps | ConvertFrom-Json
          $version = ($cargoMeta.packages | Where-Object { $_.name -eq 'irql' }).version
          if ($tag -ne $version) {
            Write-Error "Tag version ($tag) does not match Cargo.toml version ($version)"
            exit 1
          }
          Write-Output "Version check passed: $version"

      - name: Build
        run: cargo build --workspace --locked

      - name: Test
        run: cargo test --workspace --locked

      - name: Publish irql_core
        working-directory: crates/irql_core
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_API_KEY }}
        run: cargo publish

      - name: Wait for index
        run: Start-Sleep -Seconds 30
        shell: pwsh

      - name: Publish irql_macro
        working-directory: crates/irql_macro
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_API_KEY }}
        run: cargo publish

      - name: Wait for index
        run: Start-Sleep -Seconds 30
        shell: pwsh

      - name: Publish irql_alloc
        working-directory: crates/irql_alloc
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_API_KEY }}
        run: cargo publish

      - name: Wait for index
        run: Start-Sleep -Seconds 30
        shell: pwsh

      - name: Publish irql
        working-directory: crates/irql
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_API_KEY }}
        run: cargo publish

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
