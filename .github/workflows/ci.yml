name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: short
  RUSTDOCFLAGS: "-D warnings"

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  stable:
    name: Stable (no alloc)
    runs-on: windows-latest
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: >
          cargo build
          -p irql_core
          -p irql_macro
          -p irql
          -p basic
          -p struct_example
          -p function_traits

      - name: Clippy
        run: >
          cargo clippy
          -p irql_core
          -p irql_macro
          -p irql
          -p basic
          -p struct_example
          -p function_traits
          -- -D warnings

      - name: Test
        run: >
          cargo test
          -p irql_core
          -p irql_macro
          -p irql

      - name: Doc
        run: >
          cargo doc --no-deps
          -p irql_core
          -p irql_macro
          -p irql

  nightly:
    name: Nightly (alloc + drop-safety)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --workspace

      - name: Clippy
        run: cargo clippy --workspace -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: Doc
        run: cargo doc --no-deps --workspace
